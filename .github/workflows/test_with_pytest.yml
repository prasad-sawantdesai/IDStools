name: Test using pytest

on: 
    push:
    pull_request:
      types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]  # Test on multiple Python versions
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}

        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov pytest-xdist
          pip install .[test]

      - name: Download test files from Zenodo
        run: |
          mkdir -p tests
          cd tests
          
          # Download with retry on 503 errors
          for i in 1 2 3 4 5; do
            echo "Download attempt $i/5..."
            wget --retry-connrefused --waitretry=5 --timeout=30 -t 3 "https://zenodo.org/records/17062700/files/iter_disruption_113112_1.nc" -O iter_disruption_113112_1.nc && \
            wget --retry-connrefused --waitretry=5 --timeout=30 -t 3 "https://zenodo.org/records/17062700/files/iter_scenario_123364_1.nc" -O iter_scenario_123364_1.nc && \
            wget --retry-connrefused --waitretry=5 --timeout=30 -t 3 "https://zenodo.org/records/17062700/files/iter_scenario_53298_seq1_DD3.nc" -O iter_scenario_53298_seq1_DD3.nc && \
            wget --retry-connrefused --waitretry=5 --timeout=30 -t 3 "https://zenodo.org/records/17062700/files/iter_scenario_53298_seq1_DD4.nc" -O iter_scenario_53298_seq1_DD4.nc && \
            break || { echo "Download failed, waiting 30s before retry..."; sleep 30; }
          done
          
          ls -lh *.nc

      - name: Run tests
        env:
          HDF5_USE_FILE_LOCKING: "FALSE"
          PYTHONUNBUFFERED: "1"
        run: |
          # Verify files before pytest
          python -u << 'EOF'
          import sys
          import imas
          from pathlib import Path
          
          sys.stdout.flush()
          print("=" * 60, flush=True)
          print("PRE-TEST: Verifying NetCDF files", flush=True)
          print("=" * 60, flush=True)
          
          tests_dir = Path("tests")
          netcdf_files = [
              "iter_disruption_113112_1.nc",
              "iter_scenario_123364_1.nc",
              "iter_scenario_53298_seq1_DD3.nc",
              "iter_scenario_53298_seq1_DD4.nc"
          ]
          
          for filename in netcdf_files:
              filepath = tests_dir / filename
              print(f"Checking: {filepath}", flush=True)
              if filepath.exists():
                  size = filepath.stat().st_size / (1024**2)
                  print(f"  ✓ File exists: {size:.2f} MB", flush=True)
                  try:
                      conn = imas.DBEntry(str(filepath), "r")
                      print(f"  ✓ Successfully opened with IMAS", flush=True)
                      conn.close()
                  except Exception as e:
                      print(f"  ✗ ERROR opening with IMAS: {e}", flush=True)
                      raise
              else:
                  print(f"  ✗ File NOT found", flush=True)
                  raise FileNotFoundError(f"Missing: {filepath}")
          
          print("=" * 60, flush=True)
          print("All files verified successfully!", flush=True)
          print("=" * 60, flush=True)
          EOF
          
          # Run pytest with verbose output
          python -m pytest tests/ -v -s --tb=short --junit-xml=junit.xml

      - name: Upload coverage report ${{ matrix.python-version }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov

      - name: Upload test report ${{ matrix.python-version }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.python-version }}
          path: junit.xml