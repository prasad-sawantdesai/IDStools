name: Test using pytest

on: 
    push:
    pull_request:
      types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]  # Test on multiple Python versions
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}

        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov pytest-xdist
          pip install .[test]

      - name: Download test files from Zenodo
        run: |
          mkdir -p tests
          cd tests
          wget -q "https://zenodo.org/records/17062700/files/iter_disruption_113112_1.nc" -O iter_disruption_113112_1.nc
          wget -q "https://zenodo.org/records/17062700/files/iter_scenario_123364_1.nc" -O iter_scenario_123364_1.nc
          wget -q "https://zenodo.org/records/17062700/files/iter_scenario_53298_seq1_DD3.nc" -O iter_scenario_53298_seq1_DD3.nc
          wget -q "https://zenodo.org/records/17062700/files/iter_scenario_53298_seq1_DD4.nc" -O iter_scenario_53298_seq1_DD4.nc
          ls -lh *.nc

      - name: Run tests
        env:
          HDF5_USE_FILE_LOCKING: "FALSE"
        run: |
          # Debug: Test reading NetCDF files
          python << 'EOF'
          import imas
          from pathlib import Path
          
          print("=" * 60)
          print("DEBUG: Testing NetCDF file reading")
          print("=" * 60)
          
          tests_dir = Path("tests")
          
          # Test NetCDF files
          netcdf_files = [
              "iter_disruption_113112_1.nc",
              "iter_scenario_123364_1.nc",
              "iter_scenario_53298_seq1_DD3.nc",
              "iter_scenario_53298_seq1_DD4.nc"
          ]
          
          for filename in netcdf_files:
              filepath = tests_dir / filename
              print(f"Checking: {filepath}")
              if filepath.exists():
                  size = filepath.stat().st_size / (1024**2)
                  print(f"\n✓ File exists: {filename} ({size:.2f} MB)")
                  try:
                      conn = imas.DBEntry(str(filepath), "r")
                      print(f"  - Successfully opened with IMAS")
                      conn.close()
                  except Exception as e:
                      print(f"  - ERROR opening with IMAS: {e}")
              else:
                  print(f"\n✗ File NOT found: {filename}")
          
          print("\n" + "=" * 60)
          
          EOF

      - name: Upload coverage report ${{ matrix.python-version }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov

      - name: Upload test report ${{ matrix.python-version }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.python-version }}
          path: junit.xml