name: Test using pytest

on: 
    push:
    pull_request:
      types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]  # Test on multiple Python versions
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}

        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov pytest-xdist
          pip install .[test]

      - name: Download test files from Zenodo
        run: |
          mkdir -p tests
          cd tests
          
          # Function to download with retries
          download_with_retry() {
            local url=$1
            local output=$2
            local max_retries=5
            local attempt=1
            
            while [ $attempt -le $max_retries ]; do
              echo "Downloading $output (attempt $attempt/$max_retries)..."
              if wget -L -T 30 --tries=3 "$url" -O "$output" 2>&1; then
                size=$(stat -f%z "$output" 2>/dev/null || stat -c%s "$output" 2>/dev/null)
                if [ "$size" -gt 1000000 ]; then
                  echo "✓ Downloaded: $output (size: $size bytes)"
                  return 0
                else
                  echo "⚠ File too small ($size bytes), retrying..."
                  rm -f "$output"
                fi
              else
                echo "✗ Download failed, retrying..."
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            
            echo "✗ Failed to download $output after $max_retries attempts"
            return 1
          }
          
          # Download all files
          download_with_retry "https://zenodo.org/records/17062700/files/iter_disruption_113112_1.nc" "iter_disruption_113112_1.nc" || exit 1
          download_with_retry "https://zenodo.org/records/17062700/files/iter_scenario_123364_1.nc" "iter_scenario_123364_1.nc" || exit 1
          download_with_retry "https://zenodo.org/records/17062700/files/iter_scenario_53298_seq1_DD3.nc" "iter_scenario_53298_seq1_DD3.nc" || exit 1
          download_with_retry "https://zenodo.org/records/17062700/files/iter_scenario_53298_seq1_DD4.nc" "iter_scenario_53298_seq1_DD4.nc" || exit 1
          
          ls -lh *.nc

      - name: Run tests
        run: |
          # Debug: Test reading NetCDF files
          python << 'EOF'
          import imas
          from pathlib import Path
          
          print("=" * 60)
          print("DEBUG: Testing NetCDF file reading")
          print("=" * 60)
          
          tests_dir = Path("tests")
          
          # Test NetCDF files
          netcdf_files = [
              "iter_disruption_113112_1.nc",
              "iter_scenario_123364_1.nc",
              "iter_scenario_53298_seq1_DD3.nc",
              "iter_scenario_53298_seq1_DD4.nc"
          ]
          
          for filename in netcdf_files:
              filepath = tests_dir / filename
              print(f"Checking: {filepath}")
              if filepath.exists():
                  size = filepath.stat().st_size / (1024**2)
                  print(f"\n✓ File exists: {filename} ({size:.2f} MB)")
                  try:
                      conn = imas.DBEntry(str(filepath), "r")
                      print(f"  - Successfully opened with IMAS")
                      conn.close()
                  except Exception as e:
                      print(f"  - ERROR opening with IMAS: {e}")
              else:
                  print(f"\n✗ File NOT found: {filename}")
          
          print("\n" + "=" * 60)
          
          EOF

      - name: Upload coverage report ${{ matrix.python-version }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov

      - name: Upload test report ${{ matrix.python-version }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.python-version }}
          path: junit.xml